name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: build.bat

      - name: Check output
        shell: pwsh
        run: if (-not (Test-Path wineyes.exe)) { throw "wineyes.exe was not built" }

      - name: Build installer
        shell: pwsh
        run: ./installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: wineyes
          path: |
            wineyes.exe
            dist/*.exe
