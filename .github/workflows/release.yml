name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: build.bat

      - name: Build installer
        shell: pwsh
        run: ./installer.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item wineyes.exe "dist/wineyes-$version-x64.exe"
          gh release create "${{ github.ref_name }}" --title "wineyes $version" --generate-notes (Get-ChildItem dist/*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
